<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tic Tac Toe</title>
    <link rel="stylesheet" href="style.css">
    <style>
        .input-group { margin-bottom: 15px; }
        .input-label { display: block; font-size: 0.85em; color: #787c99; margin-bottom: 5px; text-transform: uppercase; }
        .select-input { width: 100%; background-color: #1a1b26; color: var(--text-main); border: 1px solid #15161e; border-radius: 5px; padding: 10px; font-size: 1em; }
        .select-input:focus { outline: 1px solid var(--accent); }
        
        /* Tic Tac Toe Grid */
        .board-container { display: flex; justify-content: center; margin: 20px 0; }
        .ttt-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; background: #565f89; padding: 10px; border-radius: 8px; }
        .ttt-cell { width: 90px; height: 90px; background: #1a1b26; border-radius: 5px; display: flex; justify-content: center; align-items: center; font-size: 4em; font-family: monospace; font-weight: bold; cursor: pointer; transition: background 0.2s; user-select: none;}
        .ttt-cell:hover { background: #24283b; }
        .ttt-cell.taken { cursor: default; }
        
        .cell-x { color: #7aa2f7; } /* User color */
        .cell-o { color: #f7768e; } /* AI color */
    </style>
</head>
<body>
    <div id="app">
        <!-- SETUP PANEL -->
        <div class="panel" id="setup-panel">
            <a href="index.html" class="action-btn back-btn">⬅ Back to Menu</a>
            <h2 class="text-center" style="margin-bottom: 20px;">Tic Tac Toe</h2>

            <div class="input-group">
                <label class="input-label">AI Difficulty</label>
                <select id="difficulty" class="select-input">
                    <option value="easy">Easy (40% Optimal Moves)</option>
                    <option value="medium" selected>Medium (70% Optimal Moves)</option>
                    <option value="hard">Hard (90% Optimal Moves)</option>
                </select>
            </div>
            
            <button class="action-btn confirm-btn" id="btn-start" style="width: 100%;">Start Game</button>
        </div>

        <!-- MAIN GAME PANEL -->
        <div class="panel" id="game-panel" style="display: none;">
            <h2 class="text-center" style="margin-bottom: 5px;">Tic Tac Toe</h2>
            <div id="status-header" class="text-center" style="font-size: 1.1em; color: var(--accent); font-weight: bold;">Your Turn (X)</div>
            
            <div class="board-container">
                <div class="ttt-grid" id="board">
                    <!-- 9 cells generated by JS -->
                </div>
            </div>
        </div>

        <!-- END GAME PANEL -->
        <div class="panel" id="end-game-panel" style="display: none;">
            <h2 class="text-center" style="color: #f7768e; margin-bottom: 10px;">Game Over</h2>
            <div id="end-stats" class="text-center" style="margin-bottom: 20px; font-size: 1.3em; line-height: 1.4; padding: 15px; background: #1a1b26; border-radius: 8px;"></div>
            
            <p style="margin-bottom: 5px; font-size: 0.9em; color: #787c99;">Your Roleplay Response:</p>
            <textarea id="end-rp-text" placeholder='e.g. *I cross my arms in triumph as I place the final X.*'></textarea>
            
            <div style="display: flex; gap: 10px; margin-top: 10px;">
                <button class="action-btn confirm-btn" id="btn-confirm-end" style="margin-bottom: 0;">Push to Chat</button>
                <button class="action-btn cancel-btn" id="btn-cancel-end" style="margin-bottom: 0;">Play Again</button>
            </div>
        </div>
    </div>
    
    <script src="st_bridge.js"></script>
    <script src="tictactoe.js"></script>
</body>
</html>

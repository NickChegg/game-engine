<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>War</title>
    <link rel="stylesheet" href="style.css">
    <style>
        #app { max-width: 1050px !important; display: flex; flex-direction: row; flex-wrap: nowrap; justify-content: center; gap: 20px; align-items: flex-start; width: 100%; }
        .side-panel { width: 340px; flex-shrink: 0; align-self: flex-start; }
        .main-panel { flex-grow: 1; max-width: 650px; min-width: 0; align-self: flex-start; }
        .input-group { margin-bottom: 15px; }
        .input-label { display: block; font-size: 0.85em; color: #787c99; margin-bottom: 5px; text-transform: uppercase; }
        .text-input, .num-input { width: 100%; background-color: #1a1b26; color: var(--text-main); border: 1px solid #15161e; border-radius: 5px; padding: 10px; font-size: 1em; box-sizing: border-box;}
    </style>
</head>
<body>
    <div id="app">
        <!-- LEFT PANEL -->
        <div class="panel side-panel">
            <a href="index.html" class="action-btn back-btn">⬅ Back to Menu</a>
            <h2 class="text-center" style="color: #f7768e; margin-bottom: 20px;">⚔️ War</h2>

            <div id="setup-phase">
                <div class="input-group">
                    <label class="input-label">Number of Players (2-4)</label>
                    <input type="number" id="num-players" class="num-input" value="2" min="2" max="4">
                </div>

                <div id="players-container" style="background: #1a1b26; padding: 10px; border-radius: 8px; margin-bottom: 15px; display: flex; flex-direction: column; gap: 8px;"></div>
                
                <button class="action-btn confirm-btn" id="btn-start" style="width: 100%; background: #f7768e; color: #1a1b26;">Shuffle & Deal</button>
            </div>

            <!-- In-Game Controls -->
            <div id="game-controls-phase" style="display: none;">
                
                <div style="background: #1a1b26; padding: 10px; border-radius: 8px; border: 1px solid #565f89; margin-bottom: 15px;">
                    <div id="action-log" style="height: 100px; overflow-y: auto; color: #a9b1d6; font-size: 0.9em; display: flex; flex-direction: column; gap: 5px; padding-right: 5px;">
                        <!-- Action text injected here -->
                    </div>
                </div>

                <button class="action-btn" id="btn-play-1" style="background: #9ece6a; color: #1a1b26; margin-bottom: 10px;">Play 1 Round</button>
                <div style="display: flex; gap: 10px; margin-bottom: 15px;">
                    <button class="action-btn" id="btn-play-10" style="background: #7aa2f7; color: #1a1b26; flex: 1; margin-bottom: 0;">Play 10x</button>
                    <button class="action-btn" id="btn-play-50" style="background: #bb9af7; color: #1a1b26; flex: 1; margin-bottom: 0;">Play 50x</button>
                </div>

                <div style="background: #1a1b26; padding: 15px; border-radius: 8px; border: 1px solid #565f89; margin-bottom: 15px;">
                    <p style="font-size: 0.8em; color: #7aa2f7; margin-bottom: 8px; font-weight: bold;">MID-GAME PUSH</p>
                    <textarea id="midgame-rp-text" placeholder="Roleplay response..." style="min-height: 50px; margin-bottom: 10px; background: #24283b; color: white; border: none; width: 100%; padding: 10px; border-radius: 5px; resize: vertical; box-sizing: border-box;"></textarea>
                    <button class="action-btn" id="btn-push-midgame" style="background-color: #565f89; color: white; margin-bottom: 0; font-size: 0.9em;">Push State to Chat</button>
                </div>

                <button class="action-btn cancel-btn" id="btn-restart" style="width: 100%; margin-bottom: 0;">🛑 Abort Match</button>
            </div>
        </div>

        <!-- RIGHT PANEL -->
        <div class="panel main-panel">
            <h2 class="text-center" style="color: white; margin-bottom: 15px;">The Battlefield</h2>
            
            <div class="war-arena" id="arena">
                <!-- Players injected here -->
                <div class="war-pool" id="pool-ui">
                    <div style="color: #565f89; font-style: italic; width: 100%; text-align: center; margin-top: 20px;">The Pool</div>
                </div>
            </div>
            
            <!-- End Game Screen -->
            <div id="end-phase" style="display: none; margin-top: 20px;">
                <h3 class="text-center" style="color: white; margin-bottom: 15px;">Game Over</h3>
                <div id="end-stats" class="text-center" style="margin-bottom: 15px; font-size: 1.3em; font-weight: bold; padding: 15px; background: #1a1b26; border-radius: 8px;"></div>
                
                <textarea id="end-rp-text" placeholder="Final roleplay response..." style="min-height: 60px; margin-bottom: 10px; background: #24283b; color: white; border: none; width: 100%; padding: 10px; border-radius: 5px; box-sizing: border-box; resize: vertical;"></textarea>
                
                <button class="action-btn confirm-btn" id="btn-push-end" style="width: 100%; margin-bottom: 10px; background: #f7768e; color: #1a1b26;">Push Results</button>
            </div>
        </div>
        
    </div>
    
    <script src="st_bridge.js"></script>
    <script src="war.js"></script>
</body>
</html>

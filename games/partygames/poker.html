<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Poker</title>
    <link rel="stylesheet" href="style.css">
    <style>
        .input-group { margin-bottom: 15px; }
        .input-label { display: block; font-size: 0.85em; color: #787c99; margin-bottom: 5px; text-transform: uppercase; }
        .text-input, .num-input, .select-input { width: 100%; background-color: #1a1b26; color: var(--text-main); border: 1px solid #15161e; border-radius: 5px; padding: 10px; font-size: 1em; margin-bottom: 5px;}
        .text-input:focus, .num-input:focus, .select-input:focus { outline: 1px solid var(--accent); }
        .flex-row { display: flex; gap: 10px; align-items: center; }
        
        /* Layout */
        .game-layout { display: flex; flex-direction: row; gap: 20px; align-items: flex-start; }
        .left-menu { width: 260px; flex-shrink: 0; display: flex; flex-direction: column; gap: 15px; }
        .right-board { flex-grow: 1; min-width: 0; display: flex; flex-direction: column; gap: 15px; }

        /* Cards */
        .playing-card {
            display: inline-flex; justify-content: center; align-items: center;
            background-color: #e0e6ed; color: black; border: 1px solid #1a1b26;
            border-radius: 5px; width: 45px; height: 65px; font-weight: bold; font-size: 1.1em;
            box-shadow: 2px 2px 5px rgba(0,0,0,0.3); margin-right: 5px; user-select: none;
        }
        .card-red { color: #d32f2f; }
        .card-black { color: #111; }
        .card-hidden { background: repeating-linear-gradient(45deg, #24283b, #24283b 5px, #1a1b26 5px, #1a1b26 10px); color: transparent; border-color: #565f89; }
        
        /* Discard Select for 5-Card Draw */
        .card-selectable { cursor: pointer; transition: transform 0.2s; }
        .card-selectable:hover { transform: translateY(-5px); }
        .card-discarded { opacity: 0.5; transform: translateY(10px) !important; border: 2px solid #f7768e; }

        /* Board Areas */
        .board-section { background: #1a1b26; border: 1px solid #24283b; border-radius: 8px; padding: 15px; }
        
        /* Opponents */
        .opponents-grid { display: flex; flex-wrap: wrap; gap: 10px; justify-content: center; }
        .opp-card { background: #15161e; border: 1px solid #565f89; border-radius: 8px; padding: 10px; text-align: center; min-width: 110px; position: relative; }
        .opp-card.active-turn { border-color: #9ece6a; box-shadow: 0 0 10px rgba(158, 206, 106, 0.2); background: rgba(158, 206, 106, 0.05); }
        .opp-card.folded { opacity: 0.5; }
        .opp-card.busted { border-color: #f7768e; opacity: 0.4; }
        .opp-name { color: #89ddff; font-weight: bold; font-size: 0.9em; margin-bottom: 5px; }
        .opp-chips { color: #e0af68; font-size: 0.85em; font-weight: bold; }
        .opp-action { position: absolute; top: -10px; right: -10px; background: #24283b; border: 1px solid #7aa2f7; color: #a9b1d6; font-size: 0.75em; padding: 2px 6px; border-radius: 10px; font-weight: bold; display: none; }
        
        .pot-display { font-size: 1.5em; color: #e0af68; font-weight: bold; text-align: center; margin: 10px 0; background: #050505; padding: 10px; border-radius: 8px; border: 1px solid #24283b; }
        
        /* Sidebar Logs & Controls */
        .action-console { background: #15161e; padding: 15px; border-radius: 8px; border: 1px solid #e0af68; }
        .game-log { background: #050505; border: 1px solid #24283b; border-radius: 5px; padding: 10px; font-size: 0.85em; color: #a9b1d6; height: 120px; overflow-y: auto; font-family: monospace; margin-bottom: 10px;}
        .game-log p { margin-bottom: 3px; }
        .control-btn { width: 100%; margin-bottom: 10px; font-size: 0.95em; padding: 12px; }
        .control-btn:last-child { margin-bottom: 0; }
        
        .bet-slider-container { display: flex; align-items: center; gap: 10px; margin-bottom: 10px; }
        #bet-slider { flex-grow: 1; accent-color: #f7768e; }
        
        .strip-alert { color: #f7768e; font-size: 0.8em; font-weight: bold; text-align: center; margin-top: 10px; display: none; }
    </style>
</head>
<body>
    <div id="app" style="max-width: 950px; width: 100%;">
        
        <!-- PHASE 1: SETUP -->
        <div class="panel" id="setup-panel">
            <a href="index.html" class="action-btn back-btn">⬅ Back to Menu</a>
            <h2 class="text-center" style="margin-bottom: 20px; color: #9ece6a;">🃏 Poker Night</h2>

            <div class="flex-row">
                <div class="input-group" style="flex: 2;">
                    <label class="input-label">Game Variant</label>
                    <select id="game-variant" class="select-input">
                        <option value="texas">Texas Hold'em</option>
                        <option value="draw">5-Card Draw</option>
                    </select>
                </div>
                <div class="input-group" style="flex: 1;">
                    <label class="input-label">Starting Chips</label>
                    <input type="number" id="starting-chips" class="num-input" value="1000" min="100">
                </div>
            </div>
            
            <div class="input-group" style="background: #15161e; padding: 10px; border-radius: 8px; border: 1px dashed #f7768e;">
                <label class="input-label" style="color: #f7768e; display: flex; align-items: center; gap: 5px;">
                    <input type="checkbox" id="strip-toggle" style="width: 16px; height: 16px;"> Enable Strip Poker
                </label>
                <select id="strip-rule" class="select-input" style="display: none; margin-top: 5px; font-size: 0.9em;">
                    <option value="round">Fast: Losers of every round strip</option>
                    <option value="bust">Standard: Strip only when a player goes Bust (0 chips)</option>
                </select>
            </div>

            <div class="input-group">
                <label class="input-label">Total Players (2-6)</label>
                <input type="number" id="num-players" class="num-input" value="4" min="2" max="6">
            </div>

            <div id="players-container" style="background: #1a1b26; padding: 10px; border-radius: 8px; margin-bottom: 15px;">
                <!-- Player inputs generated here -->
            </div>
            
            <button class="action-btn confirm-btn" id="btn-start" style="width: 100%;">Take a Seat at the Table</button>
        </div>

        <!-- PHASE 2: GAME BOARD -->
        <div class="panel" id="game-panel" style="display: none; padding: 20px;">
            <div class="game-layout">
                
                <!-- LEFT SIDEBAR -->
                <div class="left-menu">
                    <h3 style="color: #9ece6a; text-align: center;" id="game-title">Texas Hold'em</h3>
                    <div class="strip-alert" id="strip-alert">👗 Strip Mode Active</div>
                    
                    <div class="game-log" id="game-log"></div>
                    
                    <!-- Action Console -->
                    <div class="action-console" id="action-console">
                        <div id="turn-status" style="color: #e0af68; font-weight: bold; margin-bottom: 10px; text-align: center; text-transform: uppercase; font-size: 0.85em;">Waiting for Round...</div>
                        
                        <!-- User Betting Controls -->
                        <div id="user-controls" style="display: none;">
                            <div class="bet-slider-container" id="raise-container">
                                <input type="range" id="bet-slider" min="0" max="100" value="0">
                                <span id="bet-val-display" style="color: white; font-weight: bold; min-width: 40px;">0</span>
                            </div>
                            <button class="action-btn confirm-btn control-btn" id="btn-call">Call</button>
                            <button class="action-btn control-btn" id="btn-raise" style="background: #f7768e; color: #1a1b26;">Raise</button>
                            <button class="action-btn cancel-btn control-btn" id="btn-fold">Fold</button>
                        </div>
                        
                        <!-- NPC / Next Phase Controls -->
                        <button class="action-btn control-btn" id="btn-next" style="background: #e0af68; color: #1a1b26; display: none;">Next Turn ➡</button>
                    </div>

                    <!-- Mid-Game Push -->
                    <div style="background: #1a1b26; padding: 10px; border-radius: 8px; border: 1px solid #565f89;">
                        <p style="font-size: 0.8em; color: #7aa2f7; margin-bottom: 5px; font-weight: bold;">MID-GAME ROLEPLAY</p>
                        <textarea id="midgame-rp-text" placeholder="*I peer over my cards...*" style="min-height: 40px; margin-bottom: 5px; background: #24283b; color: white; border: none; width: 100%; padding: 8px; border-radius: 5px; font-size: 0.9em;"></textarea>
                        <button class="action-btn" id="btn-push-midgame" style="background-color: #565f89; color: white; margin-bottom: 0; font-size: 0.85em; padding: 10px;">Push Current State</button>
                    </div>
                </div>

                <!-- RIGHT BOARD -->
                <div class="right-board">
                    
                    <!-- Opponents Area -->
                    <div class="board-section">
                        <div class="opponents-grid" id="opponents-list">
                            <!-- Opponents injected here -->
                        </div>
                    </div>

                    <!-- Table Center -->
                    <div class="board-section" style="display: flex; flex-direction: column; align-items: center; min-height: 160px; justify-content: center;">
                        <div class="pot-display">Pot: <span id="pot-amount">0</span></div>
                        <div id="community-cards-container" style="display: flex; gap: 5px; min-height: 65px;">
                            <!-- Community cards injected here -->
                        </div>
                        <div id="phase-title" style="color: #787c99; font-size: 0.85em; margin-top: 10px; text-transform: uppercase; letter-spacing: 1px;">Pre-Flop</div>
                    </div>

                    <!-- User Hand -->
                    <div class="board-section" style="border-color: #7aa2f7;">
                        <div style="display: flex; justify-content: space-between; margin-bottom: 10px;">
                            <h3 style="color: #7aa2f7;">Your Hand</h3>
                            <h3 style="color: #e0af68;">Chips: <span id="user-chips">0</span></h3>
                        </div>
                        <div id="user-hand-container" style="display: flex; gap: 5px; justify-content: center; min-height: 65px;">
                            <!-- User cards injected here -->
                        </div>
                        <div id="user-hand-eval" style="text-align: center; color: #a9b1d6; font-size: 0.9em; margin-top: 10px; font-weight: bold;"></div>
                    </div>
                    
                </div>
            </div>
        </div>

        <!-- PHASE 3: END ROUND / END GAME PANEL -->
        <div class="panel" id="end-panel" style="display: none;">
            <h2 class="text-center" style="color: #e0af68; margin-bottom: 10px;" id="end-title">Round Over</h2>
            <div id="end-stats" style="margin-bottom: 20px; font-size: 1em; line-height: 1.4; padding: 15px; background: #1a1b26; border-radius: 8px; text-align: center;"></div>
            
            <p style="margin-bottom: 5px; font-size: 0.9em; color: #787c99;">Your Roleplay Response:</p>
            <textarea id="end-rp-text" placeholder='e.g. *I rake in the chips with a smug grin.*'></textarea>
            
            <div style="display: flex; gap: 10px; margin-top: 10px;">
                <button class="action-btn confirm-btn" id="btn-confirm-end" style="margin-bottom: 0;">Push Results & Continue</button>
                <button class="action-btn cancel-btn" id="btn-cancel-end" style="margin-bottom: 0;">End Game entirely</button>
            </div>
        </div>
    </div>
    
    <script src="st_bridge.js"></script>
    <script src="poker.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Connect 4</title>
    <link rel="stylesheet" href="style.css">
    <style>
        #app { max-width: 950px !important; display: flex; flex-direction: row; flex-wrap: wrap; justify-content: center; gap: 20px; align-items: flex-start; width: 100%; }
        .side-panel { width: 320px; align-self: flex-start; }
        .main-panel { flex-grow: 1; max-width: 580px; align-self: flex-start; }

        .input-group { margin-bottom: 15px; }
        .input-label { display: block; font-size: 0.85em; color: #787c99; margin-bottom: 5px; text-transform: uppercase; }
        .text-input, .select-input { width: 100%; background-color: #1a1b26; color: var(--text-main); border: 1px solid #15161e; border-radius: 5px; padding: 10px; font-size: 1em; box-sizing: border-box;}
        .text-input:focus, .select-input:focus { outline: 1px solid var(--accent); }
        
        .setup-card { background: #1a1b26; border: 1px solid #24283b; border-radius: 8px; padding: 15px; margin-bottom: 15px; }
        .flex-row { display: flex; gap: 10px; align-items: center; margin-bottom: 10px; }
    </style>
</head>
<body>
    <div id="app">
        <!-- LEFT PANEL -->
        <div class="panel side-panel">
            <a href="index.html" class="action-btn back-btn">⬅ Back to Menu</a>
            <h2 class="text-center" style="color: #3b5bdb; margin-bottom: 20px;">Connect 4</h2>

            <div id="setup-phase">
                <!-- Player 1 Setup -->
                <div class="setup-card" style="border-left: 4px solid #f7768e;">
                    <div class="input-group">
                        <label class="input-label" style="color: #f7768e;">🔴 Player 1 (Red)</label>
                        <input type="text" id="p1-name" class="text-input" value="{{user}}">
                    </div>
                    <div class="input-group" style="margin-bottom: 0;">
                        <select id="p1-type" class="select-input">
                            <option value="user">User Operated</option>
                            <option value="ai">AI Driven</option>
                        </select>
                    </div>
                    <div class="input-group" id="p1-diff-group" style="display: none; margin-top: 10px; margin-bottom: 0;">
                        <label class="input-label">AI Difficulty</label>
                        <select id="p1-diff" class="select-input">
                            <option value="easy">Easy</option>
                            <option value="medium" selected>Medium</option>
                            <option value="hard">Hard</option>
                        </select>
                    </div>
                </div>

                <!-- Player 2 Setup -->
                <div class="setup-card" style="border-left: 4px solid #e0af68;">
                    <div class="input-group">
                        <label class="input-label" style="color: #e0af68;">🟡 Player 2 (Yellow)</label>
                        <input type="text" id="p2-name" class="text-input" placeholder="Opponent Name">
                    </div>
                    <div class="input-group" style="margin-bottom: 0;">
                        <select id="p2-type" class="select-input">
                            <option value="user">User Operated</option>
                            <option value="ai" selected>AI Driven</option>
                        </select>
                    </div>
                    <div class="input-group" id="p2-diff-group" style="display: block; margin-top: 10px; margin-bottom: 0;">
                        <label class="input-label">AI Difficulty</label>
                        <select id="p2-diff" class="select-input">
                            <option value="easy">Easy</option>
                            <option value="medium" selected>Medium</option>
                            <option value="hard">Hard</option>
                        </select>
                    </div>
                </div>
                
                <button class="action-btn confirm-btn" id="btn-start" style="width: 100%; background: #3b5bdb; color: white;">Start Game</button>
            </div>

            <!-- In-Game Controls -->
            <div id="game-controls-phase" style="display: none;">
                <div style="background: #1a1b26; padding: 15px; border-radius: 8px; border: 1px solid #565f89; margin-bottom: 15px;">
                    <p style="font-size: 0.8em; color: #7aa2f7; margin-bottom: 8px; font-weight: bold;">MID-GAME ROLEPLAY</p>
                    <textarea id="midgame-rp-text" placeholder="Your roleplay response..." style="min-height: 60px; margin-bottom: 10px; background: #24283b; color: white; border: none; width: 100%; padding: 10px; border-radius: 5px; resize: vertical; box-sizing: border-box;"></textarea>
                    <button class="action-btn" id="btn-push-midgame" style="background-color: #565f89; color: white; margin-bottom: 0; font-size: 0.9em;">Push State to Chat</button>
                </div>

                <button class="action-btn cancel-btn" id="btn-restart" style="width: 100%; margin-bottom: 0;">🔄 Restart Match</button>
            </div>
        </div>

        <!-- RIGHT PANEL -->
        <div class="panel main-panel">
            <div id="game-header" style="display: none;">
                <h2 class="text-center" style="margin-bottom: 5px;">Connect 4</h2>
                <div id="turn-indicator" class="text-center" style="font-size: 1.2em; font-weight: bold; margin-bottom: 15px; padding: 10px; border-radius: 8px; background: #1a1b26;"></div>
            </div>

            <div id="board-container" class="c4-board-container" style="display: none;">
                <div class="c4-grid" id="c4-grid">
                    <!-- 7 Columns generated by JS -->
                </div>
            </div>

            <!-- End Game Screen -->
            <div id="end-phase" style="display: none; margin-top: 20px;">
                <h3 class="text-center" style="color: white; margin-bottom: 15px;">Game Over</h3>
                <div id="end-stats" class="text-center" style="margin-bottom: 15px; font-size: 1.3em; font-weight: bold; padding: 15px; background: #1a1b26; border-radius: 8px;"></div>
                
                <textarea id="end-rp-text" placeholder="Final roleplay response..." style="min-height: 60px; margin-bottom: 10px; background: #24283b; color: white; border: none; width: 100%; padding: 10px; border-radius: 5px; box-sizing: border-box; resize: vertical;"></textarea>
                
                <button class="action-btn confirm-btn" id="btn-push-end" style="width: 100%; margin-bottom: 10px;">Push Results</button>
            </div>
        </div>
        
    </div>
    
    <script src="st_bridge.js"></script>
    <script src="connect4.js"></script>
</body>
</html>

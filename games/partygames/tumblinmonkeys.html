<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tumblin' Monkeys</title>
    <link rel="stylesheet" href="style.css">
    <style>
        /* LAYOUT LOCK: nowrap forces side-by-side */
        .tm-wrapper { display: flex; gap: 20px; align-items: flex-start; justify-content: center; flex-wrap: nowrap; }
        
        /* SIDEBAR LOCKED TO THE LEFT: fixed 250px width, won't shrink */
        .tm-sidebar { flex: 0 0 250px; display: flex; flex-direction: column; gap: 15px; }
        
        /* MAIN TREE SECTION */
        .tm-main { flex: 1; display: flex; flex-direction: column; gap: 15px; align-items: center; min-width: 0; }
        
        /* Canvases will stack vertically if the screen is too narrow, but the sidebar stays on the left */
        .canvases-container { display: flex; gap: 10px; background: #000; padding: 10px; border-radius: 8px; border: 2px solid #565f89; box-shadow: inset 0 0 20px rgba(0,0,0,0.8); flex-wrap: wrap; justify-content: center; }
        
        .canvas-box { display: flex; flex-direction: column; align-items: center; }
        .canvas-label { color: #a9b1d6; font-size: 0.8em; font-weight: bold; text-transform: uppercase; margin-bottom: 5px; letter-spacing: 1px; }
        canvas { background-color: #1a1b26; border-radius: 4px; box-shadow: 0 4px 10px rgba(0,0,0,0.5); }
        
        .player-list { background: #1a1b26; padding: 10px; border-radius: 8px; border: 1px solid #24283b; }
        .player-row { display: flex; justify-content: space-between; align-items: center; padding: 8px; border-bottom: 1px solid #24283b; transition: 0.2s; }
        .player-row.active { background: rgba(158, 206, 106, 0.15); border-left: 4px solid #9ece6a; }
        .player-score { font-weight: bold; font-size: 1.2em; color: #f7768e; }
        
        .action-console { background: #15161e; padding: 15px; border-radius: 8px; border: 1px solid #e0af68; text-align: center; }
        .die-box { width: 60px; height: 60px; margin: 0 auto 10px auto; border-radius: 12px; border: 3px solid #fff; box-shadow: 0 4px 10px rgba(0,0,0,0.5); display: flex; justify-content: center; align-items: center; font-weight: bold; font-size: 1.2em; text-shadow: 1px 1px 2px #000; transition: transform 0.5s; }
        .die-box.rolling { animation: rollAnim 0.5s infinite; }
        @keyframes rollAnim { 0% { transform: rotate(0deg) scale(1); } 50% { transform: rotate(180deg) scale(1.1); } 100% { transform: rotate(360deg) scale(1); } }
        
        .stick-btn { width: 100%; padding: 8px; margin-bottom: 5px; background: #24283b; color: white; border: 1px solid #565f89; border-radius: 4px; cursor: pointer; transition: 0.2s; text-align: left;}
        .stick-btn:hover { filter: brightness(1.3); transform: scale(1.02); }
        .stick-btn span { font-size: 0.8em; color: #a9b1d6; float: right; }
        
        .event-log { background: #1a1b26; border-left: 4px solid #7aa2f7; padding: 10px; font-size: 0.9em; color: #a9b1d6; min-height: 60px; display: flex; align-items: center; width: 100%; box-sizing: border-box; }
        
        .push-box { background: #1a1b26; padding: 10px; border-radius: 8px; border: 1px dashed #565f89; }
        .push-box textarea { min-height: 60px; margin-bottom: 10px; font-size: 0.9em; }

        /* Setup input styles from Pop-up Pirate styling */
        .input-group { margin-bottom: 15px; }
        .input-label { display: block; font-size: 0.85em; color: #787c99; margin-bottom: 5px; text-transform: uppercase; }
        .select-input, .text-input { width: 100%; background-color: #1a1b26; color: #a9b1d6; border: 1px solid #15161e; border-radius: 5px; padding: 10px; font-size: 1em; }
        .select-input:focus, .text-input:focus { outline: 1px solid #7aa2f7; }
    </style>
</head>
<body>
    <!-- Increased max-width to comfortably fit both columns side-by-side -->
    <div id="app" style="max-width: 1000px;">
        
        <!-- SETUP PANEL -->
        <div class="panel" id="setup-panel">
            <a href="index.html" class="action-btn back-btn">⬅ Back to Menu</a>
            <h2 class="text-center" style="margin-bottom: 20px; color: #e0af68;">🐒 Tumblin' Monkeys 🌴</h2>
            
            <div id="players-setup">
                <div class="input-group">
                    <label class="input-label">Number of Players</label>
                    <select id="player-count" class="select-input">
                        <option value="2">2 Players</option>
                        <option value="3">3 Players</option>
                        <option value="4">4 Players</option>
                    </select>
                </div>

                <div class="input-group">
                    <label class="input-label" style="color: #7aa2f7;">Opponent 1 Name</label>
                    <input type="text" id="p2-name" class="text-input" placeholder="e.g. Alice">
                </div>

                <div class="input-group" id="p3-group" style="display: none;">
                    <label class="input-label" style="color: #9ece6a;">Opponent 2 Name</label>
                    <input type="text" id="p3-name" class="text-input" placeholder="e.g. Bob">
                </div>

                <div class="input-group" id="p4-group" style="display: none;">
                    <label class="input-label" style="color: #bb9af7;">Opponent 3 Name</label>
                    <input type="text" id="p4-name" class="text-input" placeholder="e.g. Charlie">
                </div>
            </div>
            
            <button class="action-btn confirm-btn" id="btn-start" style="width: 100%;">Pour Monkeys & Start Game</button>
        </div>

        <!-- GAME PANEL -->
        <div class="panel" id="game-panel" style="display: none;">
            <div class="tm-wrapper">
                
                <!-- LEFT SIDEBAR (Locked to Left) -->
                <div class="tm-sidebar">
                    <div class="player-list" id="player-list-ui">
                        <!-- Populated by JS -->
                    </div>
                    
                    <div class="action-console">
                        <div class="canvas-label">Dice Roll</div>
                        <div class="die-box" id="die-display" style="background-color: #24283b;">?</div>
                        
                        <div id="roll-controls">
                            <button class="action-btn confirm-btn" id="btn-roll" style="width: 100%; font-size: 1em; padding: 10px;">Roll Dice</button>
                        </div>
                        
                        <div id="stick-controls" style="display: none; margin-top: 15px;">
                            <div class="canvas-label" style="margin-bottom: 10px; color: #fff;">Select Stick to Pull:</div>
                            <div id="stick-buttons-container"></div>
                        </div>
                    </div>
                    
                    <div class="push-box">
                        <div class="canvas-label">Mid-Game Push</div>
                        <textarea id="mid-push-text" placeholder="Add custom RP text (e.g. *I gasp as the monkeys fall.*)"></textarea>
                        <button class="action-btn" id="btn-push-mid" style="background-color: #7aa2f7; color: #1a1b26; font-size: 0.9em; padding: 8px; margin-bottom: 0;">Push Update</button>
                    </div>
                </div>

                <!-- RIGHT MAIN AREA (Tree Canvases) -->
                <div class="tm-main">
                    <div class="canvases-container">
                        <div class="canvas-box">
                            <div class="canvas-label">Side View</div>
                            <canvas id="canvas-side" width="300" height="400"></canvas>
                        </div>
                        <div class="canvas-box">
                            <div class="canvas-label">Top View</div>
                            <canvas id="canvas-top" width="300" height="300"></canvas>
                        </div>
                    </div>
                    
                    <div class="event-log" id="event-log">
                        Game started. Waiting for the first roll...
                    </div>
                </div>
                
            </div>
        </div>

        <!-- END PANEL -->
        <div class="panel" id="end-panel" style="display: none;">
            <h2 class="text-center" style="color: #f7768e; margin-bottom: 10px;">Game Over!</h2>
            <div id="end-stats" class="text-center" style="margin-bottom: 20px; font-size: 1.1em; line-height: 1.6; padding: 15px; background: #1a1b26; border-radius: 8px;"></div>
            
            <p style="margin-bottom: 5px; font-size: 0.9em; color: #787c99;">Your Roleplay Response:</p>
            <textarea id="end-rp-text" placeholder='e.g. *I groan as the final monkey falls into my pile.*'></textarea>
            
            <div style="display: flex; gap: 10px; margin-top: 10px; flex-wrap: wrap;">
                <button class="action-btn confirm-btn" id="btn-confirm-end" style="margin-bottom: 0;">Push to Chat</button>
                <button class="action-btn back-btn" id="btn-no-push" style="margin-bottom: 0; flex: 1;">Close without Pushing</button>
                <button class="action-btn cancel-btn" id="btn-cancel-end" style="margin-bottom: 0; width: 100%;">Play Again</button>
            </div>
        </div>
        
    </div>
    
    <script src="st_bridge.js"></script>
    <script src="tumblinmonkeys.js"></script>
</body>
</html>

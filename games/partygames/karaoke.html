<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Karaoke Night</title>
    <link rel="stylesheet" href="style.css">
    <style>
        .input-group { margin-bottom: 15px; }
        .input-label { display: block; font-size: 0.85em; color: #787c99; margin-bottom: 5px; text-transform: uppercase; }
        .select-input { width: 100%; background-color: #1a1b26; color: var(--text-main); border: 1px solid #15161e; border-radius: 5px; padding: 10px; font-size: 1em; }
        .select-input:focus { outline: 1px solid var(--accent); }
        
        /* Rhythm Game UI */
        #karaoke-track { position: relative; height: 100px; background: #15161e; border-radius: 10px; overflow: hidden; border: 2px solid #24283b; margin-bottom: 15px; }
        
        #target-ring { position: absolute; left: 40px; top: 18px; width: 60px; height: 60px; border: 4px solid var(--accent); border-radius: 50%; box-sizing: border-box; z-index: 2; box-shadow: 0 0 10px rgba(122, 162, 247, 0.5); transition: transform 0.1s; }
        .ring-hit { transform: scale(1.2); border-color: white !important; box-shadow: 0 0 20px white !important; }
        
        .rhythm-note { position: absolute; top: 28px; width: 40px; height: 40px; border-radius: 50%; z-index: 1; box-shadow: inset -5px -5px 10px rgba(0,0,0,0.3); display: flex; justify-content: center; align-items: center; font-size: 1.2em; }
        
        .hit-feedback { position: absolute; left: 40px; top: -10px; font-weight: bold; font-size: 1.2em; z-index: 3; animation: floatUp 0.6s forwards; text-shadow: 0px 2px 4px rgba(0,0,0,0.8); pointer-events: none; }
        @keyframes floatUp { 0% { opacity: 1; transform: translateY(0) scale(1); } 100% { opacity: 0; transform: translateY(-30px) scale(1.2); } }
        
        .rhythm-stats { display: flex; justify-content: space-between; margin-bottom: 15px; font-size: 1.2em; font-weight: bold; color: #a9b1d6; }
        .combo-text { color: #9ece6a; }
        
        /* Controls */
        #btn-hit { display: block; width: 100%; padding: 25px; font-size: 1.5em; background-color: #89ddff; color: #1a1b26; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; user-select: none; transition: transform 0.1s;}
        #btn-hit:active { transform: scale(0.95); background-color: white; }
        
        #dpad-controls { display: none; gap: 10px; height: 70px; }
        .dpad-btn { flex: 1; border: none; border-radius: 8px; font-size: 2em; color: #1a1b26; font-weight: bold; cursor: pointer; transition: transform 0.1s; box-shadow: inset -2px -5px 10px rgba(0,0,0,0.3);}
        .dpad-btn:active { transform: scale(0.9); box-shadow: none; }
    </style>
</head>
<body>
    <div id="app">
        <!-- SETUP PANEL -->
        <div class="panel" id="setup-panel">
            <a href="index.html" class="action-btn back-btn">⬅ Back to Menu</a>
            <h2 class="text-center" style="margin-bottom: 20px; color: #89ddff;">Karaoke Night</h2>

            <div class="input-group">
                <label class="input-label">Song Style / Genre</label>
                <select id="song-style" class="select-input">
                    <option value="an upbeat Pop Anthem">Upbeat Pop Anthem</option>
                    <option value="a sweeping Power Ballad">Sweeping Power Ballad</option>
                    <option value="a fast-paced Rock Track">Fast-paced Rock Track</option>
                    <option value="a smooth R&B Groove">Smooth R&B Groove</option>
                </select>
            </div>

            <div class="input-group">
                <label class="input-label">Difficulty</label>
                <select id="difficulty" class="select-input">
                    <option value="easy">Easy (1 Button, Slow)</option>
                    <option value="normal" selected>Normal (1 Button, Fast)</option>
                    <option value="hard">Hard (4 Arrow Keys, Fast)</option>
                </select>
            </div>
            
            <button class="action-btn confirm-btn" id="btn-start" style="width: 100%; background-color: #89ddff; color: #1a1b26;">Take the Stage!</button>
        </div>

        <!-- MAIN GAME PANEL -->
        <div class="panel" id="game-panel" style="display: none; padding: 20px;">
            <h2 class="text-center" id="game-title" style="color: #89ddff; margin-bottom: 10px;">Singing...</h2>
            
            <div class="rhythm-stats">
                <div>Score: <span id="score-display">0</span></div>
                <div class="combo-text">Combo: <span id="combo-display">0</span>x</div>
            </div>

            <div id="karaoke-track">
                <div id="target-ring"></div>
            </div>

            <!-- Standard 1-Button Control -->
            <button id="btn-hit">TAP HERE or SPACEBAR!</button>
            
            <!-- Hard Mode 4-Button Controls -->
            <div id="dpad-controls">
                <button class="dpad-btn" data-dir="ArrowLeft" style="background-color: #f7768e;">⬅️</button>
                <button class="dpad-btn" data-dir="ArrowDown" style="background-color: #7aa2f7;">⬇️</button>
                <button class="dpad-btn" data-dir="ArrowUp" style="background-color: #9ece6a;">⬆️</button>
                <button class="dpad-btn" data-dir="ArrowRight" style="background-color: #e0af68;">➡️</button>
            </div>
            
            <p id="control-hint" style="text-align: center; color: #787c99; font-size: 0.85em; margin-top: 15px; font-weight: bold;"></p>
        </div>

        <!-- END GAME PANEL -->
        <div class="panel" id="end-game-panel" style="display: none;">
            <h2 class="text-center" style="color: #89ddff; margin-bottom: 10px;">Performance Over</h2>
            <div id="end-stats" class="text-center" style="margin-bottom: 20px; font-size: 1.1em; line-height: 1.4; padding: 15px; background: #1a1b26; border-radius: 8px;"></div>
            
            <p style="margin-bottom: 5px; font-size: 0.9em; color: #787c99;">Your Roleplay Response:</p>
            <textarea id="end-rp-text" placeholder='e.g. *I take a deep breath and bow as the final note rings out.*'></textarea>
            
            <div style="display: flex; gap: 10px; margin-top: 10px;">
                <button class="action-btn confirm-btn" id="btn-confirm-end" style="margin-bottom: 0;">Push to Chat</button>
                <button class="action-btn cancel-btn" id="btn-cancel-end" style="margin-bottom: 0;">Try Another Song</button>
            </div>
        </div>
    </div>
    
    <script src="st_bridge.js"></script>
    <script src="karaoke.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>7 Minutes of Heaven</title>
    <link rel="stylesheet" href="style.css">
    <style>
        #app { max-width: 950px !important; display: flex; flex-direction: row; flex-wrap: wrap; justify-content: center; gap: 20px; align-items: flex-start; width: 100%; position: relative; }
        .side-panel { width: 340px; flex-shrink: 0; align-self: flex-start; }
        .main-panel { flex-grow: 1; max-width: 550px; min-width: 300px; align-self: flex-start; }
        
        .input-group { margin-bottom: 15px; }
        .input-label { display: block; font-size: 0.85em; color: #787c99; margin-bottom: 5px; text-transform: uppercase; }
        .text-input { width: 100%; background-color: #1a1b26; color: var(--text-main); border: 1px solid #15161e; border-radius: 5px; padding: 10px; font-size: 1em; box-sizing: border-box;}
        .text-input:focus { outline: 1px solid var(--accent); }

        /* Action Selection Grid */
        .action-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
            margin-bottom: 15px;
        }
        .action-radio { display: none; }
        .action-label {
            background: #1a1b26; border: 1px solid #565f89; color: #a9b1d6;
            padding: 10px; text-align: center; border-radius: 5px;
            cursor: pointer; transition: all 0.2s; font-size: 0.9em; font-weight: bold;
        }
        .action-radio:checked + .action-label {
            background: #bb9af7; color: #1a1b26; border-color: #bb9af7;
        }

        /* The Dark Closet Arena */
        .heaven-arena {
            width: 100%; aspect-ratio: 4 / 5; background-color: #050505; 
            border: 2px solid #565f89; border-radius: 8px; position: relative;
            cursor: crosshair; box-shadow: inset 0 0 40px rgba(0,0,0,1);
        }

        /* Debug Mode Overlay */
        .debug-hitbox {
            position: absolute; border: 1px solid rgba(158, 206, 106, 0.5);
            background: rgba(158, 206, 106, 0.1); color: #9ece6a; font-size: 0.7em;
            display: flex; justify-content: center; align-items: center;
            pointer-events: none; display: none;
        }

        #action-log {
            height: 150px; overflow-y: auto; color: #a9b1d6; font-size: 0.9em;
            display: flex; flex-direction: column; gap: 5px; padding: 10px;
            background: #1a1b26; border-radius: 8px; border: 1px solid #24283b;
            margin-bottom: 15px; font-family: monospace;
        }
        
        .log-user { color: #89ddff; }
        .log-npc { color: #f7768e; }
        .log-wall { color: #787c99; }

        /* Action Confirmation Modal */
        #action-modal {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.8); z-index: 100;
            display: none; justify-content: center; align-items: center;
        }
        .modal-box {
            background: #1a1b26; padding: 20px; border-radius: 8px;
            border: 1px solid #bb9af7; width: 90%; max-width: 450px; box-shadow: 0 10px 25px rgba(0,0,0,0.8);
        }
    </style>
</head>
<body>
    <div id="app">
        <!-- LEFT PANEL (Controls) -->
        <div class="panel side-panel">
            <a href="index.html" class="action-btn back-btn">⬅ Back to Menu</a>
            <h2 class="text-center" style="color: #bb9af7; margin-bottom: 20px;">💋 7 Minutes</h2>

            <!-- SETUP PHASE -->
            <div id="setup-phase">
                <p style="font-size: 0.85em; color: #787c99; text-align: center; margin-bottom: 15px;">
                    Step into the pitch-black closet. Choose an action and touch in the dark.
                </p>

                <div class="input-group">
                    <label class="input-label">Partner's Name</label>
                    <input type="text" id="partner-name" class="text-input" placeholder="e.g. Alice">
                </div>
                
                <button class="action-btn confirm-btn" id="btn-start" style="width: 100%; background: #bb9af7; color: #1a1b26;">Enter the Closet</button>
            </div>

            <!-- GAME PHASE -->
            <div id="game-controls-phase" style="display: none;">
                <label class="input-label">1. Choose Your Action</label>
                <div class="action-grid">
                    <input type="radio" name="user-action" id="act-touch" value="touched" class="action-radio" checked>
                    <label for="act-touch" class="action-label">Touch</label>

                    <input type="radio" name="user-action" id="act-kiss" value="kissed" class="action-radio">
                    <label for="act-kiss" class="action-label">Kiss</label>

                    <input type="radio" name="user-action" id="act-pinch" value="pinched" class="action-radio">
                    <label for="act-pinch" class="action-label">Pinch</label>

                    <input type="radio" name="user-action" id="act-stroke" value="stroked" class="action-radio">
                    <label for="act-stroke" class="action-label">Stroke</label>

                    <input type="radio" name="user-action" id="act-grab" value="grabbed" class="action-radio">
                    <label for="act-grab" class="action-label">Grab</label>
                    
                    <input type="radio" name="user-action" id="act-lick" value="licked" class="action-radio">
                    <label for="act-lick" class="action-label">Lick</label>
                </div>

                <div class="input-group">
                    <label class="input-label">Or Custom Action (Past Tense)</label>
                    <input type="text" id="custom-action" class="text-input" placeholder="e.g. nibbled">
                </div>

                <div style="text-align: center; margin-bottom: 15px; font-size: 0.85em; color: #787c99;">
                    <i>2. Click on the dark screen to act!</i>
                </div>

                <hr style="border-color: #24283b; margin-bottom: 15px;">

                <button class="action-btn" id="btn-npc-act" style="background: #f7768e; color: #1a1b26; margin-bottom: 15px; font-size: 0.95em;">
                    Random Partner Action 🎲
                </button>

                <div id="action-log">
                    <!-- Logs go here -->
                </div>

                <button class="action-btn cancel-btn" id="btn-end-game" style="width: 100%; margin-bottom: 0;">Leave Closet</button>
            </div>
        </div>

        <!-- RIGHT PANEL (Arena & End Screen) -->
        <div class="panel main-panel">
            <div id="arena-phase">
                <h3 class="text-center" style="color: #787c99; margin-bottom: 15px;">The Dark Closet</h3>
                <div class="heaven-arena" id="arena">
                    <!-- Hitboxes injected here for debugging if needed -->
                </div>
            </div>

            <!-- End Game Screen -->
            <div id="end-phase" style="display: none;">
                <h2 class="text-center" style="color: #bb9af7; margin-bottom: 15px;">Time's Up!</h2>
                
                <p style="font-size: 0.9em; color: #a9b1d6; text-align: center; margin-bottom: 20px;">
                    The 7 minutes are over. You step out into the light. If playing with Strip Rules, did anyone lose a bet in there?
                </p>

                <div class="input-group">
                    <label class="input-label">Strip Punishment Target</label>
                    <select id="punishment-target" class="text-input">
                        <option value="none">Nobody</option>
                        <option value="user">You ({{user}})</option>
                        <option value="partner">Partner</option>
                    </select>
                </div>

                <textarea id="end-rp-text" placeholder="Final roleplay response as you exit..." style="min-height: 80px; margin-bottom: 10px; background: #24283b; color: white; border: none; width: 100%; padding: 10px; border-radius: 5px; box-sizing: border-box; resize: vertical;"></textarea>
                
                <button class="action-btn confirm-btn" id="btn-push-end" style="width: 100%; margin-bottom: 10px; background: #bb9af7; color: #1a1b26;">Push Results & Exit</button>
            </div>
        </div>

        <!-- ACTION CONFIRMATION MODAL -->
        <div id="action-modal">
            <div class="modal-box">
                <h3 style="color: #bb9af7; margin-bottom: 10px;">Confirm Action</h3>
                <p id="modal-action-text" style="color: #a9b1d6; margin-bottom: 15px; font-weight: bold; font-family: monospace; background: #050505; padding: 10px; border-radius: 5px; border: 1px dashed #565f89;"></p>
                <textarea id="modal-rp-text" placeholder="Add roleplay response (optional)..." style="width: 100%; height: 80px; margin-bottom: 15px; background: #24283b; color: white; border: none; padding: 10px; border-radius: 5px; box-sizing: border-box; resize: vertical;"></textarea>
                <div style="display: flex; gap: 10px;">
                    <button class="action-btn confirm-btn" id="btn-modal-confirm" style="margin-bottom: 0; flex: 2; background: #9ece6a; color: #1a1b26;">Confirm & Push</button>
                    <button class="action-btn cancel-btn" id="btn-modal-cancel" style="margin-bottom: 0; flex: 1;">Cancel</button>
                </div>
            </div>
        </div>
        
    </div>
    
    <script src="st_bridge.js"></script>
    <script src="sevenminutes.js"></script>
</body>
</html>

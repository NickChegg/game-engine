<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pin the Tail on the Donkey</title>
    <link rel="stylesheet" href="style.css">
    <style>
        .input-group { margin-bottom: 15px; }
        .input-label { display: block; font-size: 0.85em; color: #787c99; margin-bottom: 5px; text-transform: uppercase; }
        .text-input, .num-input { width: 100%; background-color: #1a1b26; color: var(--text-main); border: 1px solid #15161e; border-radius: 5px; padding: 10px; font-size: 1em; margin-bottom: 5px;}
        .text-input:focus, .num-input:focus { outline: 1px solid var(--accent); }
        .flex-row { display: flex; gap: 10px; align-items: center; }
        .flex-row > * { flex: 1; }
        
        /* Arena Styles */
        .pin-arena-container {
            width: 100%;
            display: flex;
            justify-content: center;
            margin: 15px 0;
        }

        .pin-arena {
            width: 100%;
            max-width: 600px;
            height: 400px;
            background-color: #050505;
            border: 2px solid #565f89;
            border-radius: 8px;
            position: relative;
            overflow: hidden;
            box-shadow: inset 0 0 20px rgba(0,0,0,0.8);
            cursor: crosshair; /* Helps signal "aiming" */
        }

        /* Elements inside Arena */
        #donkey-img {
            position: absolute;
            width: 250px;
            height: auto;
            opacity: 0; /* Hidden initially, but retains dimensions */
            pointer-events: none;
            transition: opacity 0.3s ease-in;
            z-index: 1;
        }

        #tail-img {
            position: absolute;
            width: 40px; /* Estimated width */
            height: auto;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s ease-in;
            z-index: 2;
            /* Anchors the top-left of the image to the click coordinate */
            transform-origin: top left; 
        }

        .target-marker {
            position: absolute;
            width: 10px;
            height: 10px;
            background-color: #9ece6a;
            border-radius: 50%;
            transform: translate(-50%, -50%);
            opacity: 0;
            z-index: 3;
            box-shadow: 0 0 5px #000;
        }

        /* Player turn badge */
        .turn-badge {
            background: #24283b;
            padding: 10px 15px;
            border-radius: 8px;
            border: 1px solid #7aa2f7;
            text-align: center;
            font-size: 1.1em;
            font-weight: bold;
            color: #7aa2f7;
            margin-bottom: 10px;
        }

        .score-row {
            display: flex;
            justify-content: space-between;
            padding: 8px 10px;
            background: #1a1b26;
            border: 1px solid #24283b;
            border-radius: 5px;
            margin-bottom: 5px;
        }
    </style>
</head>
<body>
    <div id="app" style="max-width: 650px;">
        
        <!-- PHASE 1: SETUP -->
        <div class="panel" id="setup-panel">
            <a href="index.html" class="action-btn back-btn">⬅ Back to Menu</a>
            <h2 class="text-center" style="margin-bottom: 20px; color: #f7768e;">🐴 Pin the Tail</h2>
            
            <p style="font-size: 0.85em; color: #787c99; text-align: center; margin-bottom: 15px;">
                The screen goes pitch black. Click where you think the donkey's tail should go. Closest guess wins!
            </p>

            <div class="input-group">
                <label class="input-label">Total Players</label>
                <input type="number" id="num-players" class="num-input" value="2" min="2" max="8">
            </div>

            <div id="players-container" style="background: #1a1b26; padding: 10px; border-radius: 8px; margin-bottom: 15px;">
                <!-- Player inputs generated here -->
            </div>
            
            <button class="action-btn confirm-btn" id="btn-start" style="width: 100%;">Put on Blindfolds</button>
        </div>

        <!-- PHASE 2: GAME BOARD -->
        <div class="panel" id="game-panel" style="display: none;">
            <div class="turn-badge" id="turn-badge">Player 1's Turn</div>

            <div class="pin-arena-container">
                <div class="pin-arena" id="arena">
                    <img id="donkey-img" src="assets/donkey.png" alt="Donkey">
                    <img id="tail-img" src="assets/tail.png" alt="Tail">
                    <div id="target-marker" class="target-marker"></div>
                </div>
            </div>
            
            <div id="result-message" style="text-align: center; margin-bottom: 15px; font-weight: bold; height: 24px; color: #a9b1d6;">
                <!-- Distance result pops up here -->
            </div>
            
            <button class="action-btn" id="btn-next-turn" style="background: #e0af68; color: #1a1b26; margin-bottom: 0; display: none;">Next Turn ➡</button>
        </div>

        <!-- PHASE 3: END GAME PANEL -->
        <div class="panel" id="end-game-panel" style="display: none;">
            <h2 class="text-center" style="color: #9ece6a; margin-bottom: 10px;">Game Over</h2>
            
            <div id="end-stats" style="margin-bottom: 20px; font-size: 1em; padding: 15px; background: #1a1b26; border-radius: 8px;">
                <!-- Leaderboard -->
            </div>
            
            <p style="margin-bottom: 5px; font-size: 0.9em; color: #787c99;">Your Roleplay Response:</p>
            <textarea id="end-rp-text" placeholder='e.g. *I take off my blindfold and burst into laughter at where the tail ended up.*'></textarea>
            
            <div style="display: flex; gap: 10px; margin-top: 10px;">
                <button class="action-btn confirm-btn" id="btn-confirm-end" style="margin-bottom: 0;">Push Results</button>
                <button class="action-btn cancel-btn" id="btn-cancel-end" style="margin-bottom: 0;">Play Again</button>
            </div>
        </div>
    </div>
    
    <script src="st_bridge.js"></script>
    <script src="pintail.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Truth or Dare</title>
    <link rel="stylesheet" href="style.css">
    <style>
        .input-group { margin-bottom: 15px; }
        .input-label { display: block; font-size: 0.85em; color: #787c99; margin-bottom: 5px; text-transform: uppercase; }
        .text-input, .num-input, .select-input {
            width: 100%; background-color: #1a1b26; color: var(--text-main);
            border: 1px solid #15161e; border-radius: 5px; padding: 10px; font-size: 1em;
        }
        .text-input:focus, .num-input:focus, .select-input:focus { outline: 1px solid var(--accent); }
        .name-slots { display: flex; flex-direction: column; gap: 8px; margin-bottom: 15px; padding: 10px; background: #1a1b26; border-radius: 8px;}
        
        /* The locked-in player list styling */
        .player-list { list-style: none; padding: 0; margin: 20px 0; background: #1a1b26; border-radius: 8px; overflow: hidden;}
        .player-item { padding: 12px 15px; border-bottom: 1px solid #15161e; font-size: 1.1em; transition: all 0.3s; color: #565f89; }
        .player-item:last-child { border-bottom: none; }
        .player-item.active { background-color: #f7768e; color: #1a1b26; font-weight: bold; transform: scale(1.02); box-shadow: 0 2px 10px rgba(247, 118, 142, 0.2); }
        
        .mode-badge { text-align: center; font-size: 0.85em; color: #f7768e; margin-bottom: 15px; text-transform: uppercase; letter-spacing: 1px;}
    </style>
</head>
<body>
    <div id="app">
        <!-- SETUP PANEL -->
        <div class="panel" id="setup-panel">
            <a href="index.html" class="action-btn back-btn">⬅ Back to Menu</a>
            
            <h2 class="text-center" style="margin-bottom: 20px; color: #f7768e;">Truth or Dare</h2>

            <div class="input-group">
                <label class="input-label">Game Rule / Mode</label>
                <select id="game-mode" class="select-input">
                    <option value="asker">The turn player ASKS someone else</option>
                    <option value="target">The turn player RECEIVES a request</option>
                </select>
            </div>

            <div class="input-group">
                <label class="input-label">Player Order (Top goes first)</label>
                <input type="number" id="num-named" class="num-input" value="3" min="2" max="20">
            </div>

            <div id="name-slots-container" class="name-slots"></div>

            <hr style="border: 1px solid #15161e; margin: 20px 0;">
            
            <button class="action-btn confirm-btn" id="btn-start" style="width: 100%; background-color: #f7768e; color: #1a1b26;">Lock In & Start</button>
        </div>

        <!-- ACTIVE GAME PANEL -->
        <div class="panel" id="game-panel" style="display: none;">
            <h2 class="text-center" style="color: #f7768e; margin-bottom: 5px;">Truth or Dare</h2>
            <div id="active-mode-badge" class="mode-badge">Mode</div>
            
            <ul class="player-list" id="player-list-ui">
                <!-- Players will be rendered here -->
            </ul>

            <!-- NEW: Roleplay Text Box -->
            <div style="background: #1a1b26; padding: 15px; border-radius: 8px; border: 1px solid #565f89; margin-bottom: 15px;">
                <p style="font-size: 0.85em; color: #f7768e; margin-bottom: 8px; font-weight: bold;">ROLEPLAY RESPONSE (OPTIONAL)</p>
                <textarea id="turn-rp-text" placeholder='e.g. *I grin mischievously.* "Alright, whose turn is it?"' style="min-height: 60px; margin-bottom: 0; background: #24283b; color: white; border: none; width: 100%; padding: 10px; border-radius: 5px; resize: vertical;"></textarea>
            </div>
            
            <button class="action-btn confirm-btn" id="btn-next-turn" style="background-color: #f7768e; color: #1a1b26; margin-bottom: 10px;">
                Push Turn & Message to Chat ➡
            </button>
            <button class="action-btn cancel-btn" id="btn-end-game" style="margin-bottom: 0;">End Game / Edit Order</button>
        </div>
    </div>
    
    <script src="st_bridge.js"></script>
    <script src="truthordare.js"></script>
</body>
</html>

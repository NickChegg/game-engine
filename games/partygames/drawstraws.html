<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Draw Straws</title>
    <link rel="stylesheet" href="style.css">
    <style>
        /* A few extra styles for our setup inputs */
        .input-group { margin-bottom: 15px; }
        .input-label { display: block; font-size: 0.85em; color: #787c99; margin-bottom: 5px; text-transform: uppercase; }
        .text-input, .num-input {
            width: 100%; background-color: #1a1b26; color: var(--text-main);
            border: 1px solid #15161e; border-radius: 5px; padding: 10px; font-size: 1em;
        }
        .text-input:focus, .num-input:focus { outline: 1px solid var(--accent); }
        .name-slots { display: flex; flex-direction: column; gap: 8px; margin-bottom: 15px; padding: 10px; background: #1a1b26; border-radius: 8px;}
    </style>
</head>
<body>
    <div id="app">
        <!-- SETUP PANEL -->
        <div class="panel" id="setup-panel">
            <a href="index.html" class="action-btn back-btn">⬅ Back to Menu</a>
            
            <h2 class="text-center" style="margin-bottom: 20px;">Draw Straws</h2>

            <div class="input-group">
                <label class="input-label">Named Participants</label>
                <input type="number" id="num-named" class="num-input" value="2" min="1" max="10">
            </div>

            <!-- Dynamic slots will be injected here by JS -->
            <div id="name-slots-container" class="name-slots"></div>

            <div class="input-group">
                <label class="input-label">Others (Unnamed NPCs)</label>
                <input type="number" id="num-others" class="num-input" value="0" min="0" max="100">
            </div>

            <hr style="border: 1px solid #15161e; margin: 20px 0;">
            
            <button class="action-btn confirm-btn" id="btn-draw" style="width: 100%;">🥢 Draw Straws</button>
        </div>

        <!-- END GAME PANEL (Hidden by default) -->
        <div class="panel" id="end-game-panel" style="display: none;">
            <h2 class="text-center" style="color: #f7768e; margin-bottom: 10px;">The Result</h2>
            <p id="end-stats" class="text-center" style="margin-bottom: 20px; font-size: 1.1em; line-height: 1.4;"></p>
            
            <p style="margin-bottom: 5px; font-size: 0.9em; color: #787c99;">Your Roleplay Response:</p>
            <textarea id="end-rp-text" placeholder='e.g. *I let out a sigh of relief as I inspect my long straw.*'></textarea>
            
            <div style="display: flex; gap: 10px; margin-top: 10px;">
                <button class="action-btn confirm-btn" id="btn-confirm-end" style="margin-bottom: 0;">Push to Chat</button>
                <button class="action-btn cancel-btn" id="btn-cancel-end" style="margin-bottom: 0;">Redraw</button>
            </div>
        </div>
    </div>
    
    <script src="st_bridge.js"></script>
    <script src="drawstraws.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Snakes & Ladders</title>
    <link rel="stylesheet" href="style.css">
    <style>
        #app { max-width: 950px !important; display: flex; flex-direction: row; flex-wrap: wrap; justify-content: center; gap: 20px; align-items: flex-start; width: 100%; }
        .side-panel { width: 320px; align-self: flex-start; }
        .main-panel { flex-grow: 1; max-width: 580px; align-self: flex-start; }

        .input-group { margin-bottom: 15px; }
        .input-label { display: block; font-size: 0.85em; color: #787c99; margin-bottom: 5px; text-transform: uppercase; }
        .text-input, .num-input { width: 100%; background-color: #1a1b26; color: var(--text-main); border: 1px solid #15161e; border-radius: 5px; padding: 10px; font-size: 1em; }
        
        .toggle-group { display: flex; align-items: center; gap: 10px; padding: 10px; background: #1a1b26; border-radius: 8px; margin-bottom: 15px; }
        .toggle-btn { flex: 1; padding: 10px; background: #24283b; color: #a9b1d6; border: 1px solid #565f89; border-radius: 5px; cursor: pointer; font-weight: bold; text-align: center; }
        .toggle-btn.active { background: #9ece6a; color: #1a1b26; border-color: #9ece6a; }

        .player-setup-row { display: flex; gap: 5px; margin-bottom: 8px; }
        .color-picker { width: 40px; height: 42px; padding: 0; border: 1px solid #565f89; border-radius: 5px; background: #1a1b26; cursor: pointer; }
    </style>
</head>
<body>
    <div id="app">
        
        <!-- LEFT PANEL: Setup & HUD -->
        <div class="panel side-panel">
            <a href="index.html" class="action-btn back-btn">⬅ Back to Menu</a>
            <h2 class="text-center" style="color: #9ece6a; margin-bottom: 15px;">Snakes & Ladders</h2>

            <!-- Setup Phase -->
            <div id="setup-phase">
                <div class="input-group">
                    <label class="input-label">Win Condition</label>
                    <div style="display: flex; gap: 5px;">
                        <button class="toggle-btn active" id="cond-winner" onclick="setCondition('winner')">One Winner</button>
                        <button class="toggle-btn" id="cond-loser" onclick="setCondition('loser')">One Loser</button>
                    </div>
                </div>

                <div class="input-group">
                    <label class="input-label">Dice Configuration</label>
                    <div style="display: flex; gap: 5px;">
                        <button class="toggle-btn active" id="dice-1" onclick="setDice(1)">1 Die</button>
                        <button class="toggle-btn" id="dice-2" onclick="setDice(2)">2 Dice</button>
                    </div>
                </div>

                <div class="toggle-group" style="justify-content: space-between;">
                    <label style="font-size: 0.9em; color: #a9b1d6; cursor: pointer;">Randomize Start Order</label>
                    <input type="checkbox" id="randomize-order" checked style="width: 18px; height: 18px;">
                </div>

                <div class="input-group">
                    <label class="input-label">Number of Players (2-10)</label>
                    <input type="number" id="num-players" class="num-input" value="3" min="2" max="10">
                </div>

                <div id="players-container" style="background: #1a1b26; padding: 10px; border-radius: 8px; margin-bottom: 15px;"></div>
                
                <button class="action-btn confirm-btn" id="btn-start" style="width: 100%; margin-bottom: 0;">Start Game</button>
            </div>

            <!-- Active Game HUD -->
            <div id="game-phase" style="display: none;">
                <div id="player-list-ui" style="background: #1a1b26; border-radius: 8px; border: 1px solid #24283b; margin-bottom: 15px; max-height: 250px; overflow-y: auto;"></div>
                
                <button class="action-btn" id="btn-roll" style="background: #9ece6a; color: #1a1b26; font-size: 1.2em; padding: 15px; margin-bottom: 15px;">Roll Dice</button>
                <button class="action-btn" id="btn-forfeit" style="background: #f7768e; color: #1a1b26; margin-bottom: 15px; display: none;">Forfeit (Accept Last Place)</button>

                <div style="background: #1a1b26; padding: 15px; border-radius: 8px; border: 1px solid #565f89;">
                    <p style="font-size: 0.8em; color: #7aa2f7; margin-bottom: 8px; font-weight: bold;">MID-GAME ROLEPLAY</p>
                    <textarea id="midgame-rp-text" placeholder="Your roleplay response..." style="min-height: 50px; margin-bottom: 10px; background: #24283b; color: white; border: none; width: 100%; padding: 10px; border-radius: 5px;"></textarea>
                    <button class="action-btn" id="btn-push-midgame" style="background-color: #565f89; color: white; margin-bottom: 0; font-size: 0.9em;">Push Action & State</button>
                </div>
            </div>

            <!-- End Game Panel -->
            <div id="end-phase" style="display: none;">
                <h3 class="text-center" style="color: #e0af68; margin-bottom: 15px;">Game Over</h3>
                
                <textarea id="end-rp-text" placeholder="Final roleplay response..." style="min-height: 60px; margin-bottom: 10px; background: #24283b; color: white; border: none; width: 100%; padding: 10px; border-radius: 5px;"></textarea>
                
                <button class="action-btn confirm-btn" id="btn-push-end" style="width: 100%; margin-bottom: 10px;">Push Results</button>
                <button class="action-btn cancel-btn" id="btn-restart" style="width: 100%; margin-bottom: 0;">New Game</button>
            </div>
        </div>

        <!-- RIGHT PANEL: Game Board -->
        <div class="panel main-panel" style="padding: 15px; display: flex; justify-content: center; align-items: center; background: #15161e;">
            <div class="sl-board-wrapper">
                <div class="sl-ghost-grid" id="ghost-grid">
                    <!-- 100 cells generated by JS -->
                </div>
            </div>
        </div>
        
    </div>
    
    <script src="st_bridge.js"></script>
    <script src="snakes.js"></script>
</body>
</html>

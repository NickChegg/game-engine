<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Darts</title>
    <link rel="stylesheet" href="style.css">
    <style>
        /* Forced Left-Panel Layout */
        body { align-items: flex-start; justify-content: center; padding-top: 40px; }
        #app { display: flex; flex-direction: row !important; flex-wrap: nowrap !important; width: 100%; max-width: 1000px; gap: 20px; align-items: flex-start; }
        .side-panel { width: 340px; flex-shrink: 0; }
        .main-panel { flex-grow: 1; max-width: 600px; }

        /* Unified Setup Aesthetics */
        .input-group { margin-bottom: 15px; }
        .input-label { display: block; font-size: 0.85em; color: #787c99; margin-bottom: 5px; text-transform: uppercase; font-weight: bold; }
        .text-input, .select-input { width: 100%; background-color: #1a1b26; color: var(--text-main); border: 1px solid #15161e; border-radius: 5px; padding: 10px; font-size: 1em; box-sizing: border-box; }
        .text-input:focus, .select-input:focus { outline: 1px solid var(--accent); }
        .setup-card { background: #1a1b26; border: 1px solid #24283b; border-radius: 8px; padding: 15px; margin-bottom: 15px; }

        /* Player List styling */
        .player-row { display: flex; gap: 8px; margin-bottom: 10px; align-items: center; background: #15161e; padding: 8px; border-radius: 6px; border: 1px solid #24283b;}
        .remove-btn { background: #f7768e; color: #1a1b26; border: none; border-radius: 4px; width: 30px; height: 30px; cursor: pointer; font-weight: bold; flex-shrink: 0; transition: background 0.2s;}
        .remove-btn:hover { background: #ff9eaf; }
        .add-btn { background: #565f89; color: white; border: none; padding: 4px 10px; border-radius: 4px; cursor: pointer; font-size: 0.85em; font-weight: bold; transition: 0.2s; }
        .add-btn:hover { background: #7aa2f7; color: #1a1b26; }
        
        /* Dartboard UI */
        .board-container {
            position: relative; width: 450px; height: 450px; margin: 0 auto;
            background-image: url('assets/dartboard.png'); background-size: cover; background-position: center;
            border-radius: 50%; box-shadow: 0 10px 30px rgba(0,0,0,0.8), inset 0 0 20px rgba(0,0,0,0.5);
            cursor: crosshair; overflow: hidden;
        }
        
        .dart-marker {
            position: absolute; width: 8px; height: 8px; background-color: #f7768e; border: 1px solid white;
            border-radius: 50%; transform: translate(-50%, -50%); pointer-events: none; box-shadow: 0 0 5px black; z-index: 5;
        }

        .dart-reticle {
            position: absolute; width: 24px; height: 24px; border: 2px solid rgba(137, 221, 255, 0.8);
            border-radius: 50%; transform: translate(-50%, -50%); pointer-events: none; z-index: 10; display: none;
            box-shadow: 0 0 10px rgba(137, 221, 255, 0.5);
        }
        .dart-reticle::after, .dart-reticle::before { content: ''; position: absolute; background: rgba(137, 221, 255, 0.8); }
        .dart-reticle::after { top: 10px; left: -4px; width: 28px; height: 2px; }
        .dart-reticle::before { top: -4px; left: 10px; width: 2px; height: 28px; }

        /* Score HUD */
        .hud-grid { display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 20px; justify-content: center; }
        .hud-card { background: #1a1b26; border: 2px solid #24283b; padding: 10px 15px; border-radius: 8px; text-align: center; flex: 1; min-width: 100px; transition: border-color 0.2s;}
        .hud-card.active { border-color: #89ddff; box-shadow: 0 0 15px rgba(137, 221, 255, 0.2); }
        .hud-card.finished { opacity: 0.5; border-color: #9ece6a; }
        .hud-name { font-size: 0.9em; color: #787c99; font-weight: bold; margin-bottom: 5px; }
        .hud-score { font-size: 2em; color: white; font-weight: bold; }
        .hud-rank { font-size: 0.8em; color: #9ece6a; display: block; margin-top: 5px; text-transform: uppercase;}
        .darts-left-display { color: #89ddff; font-weight: bold; font-size: 1.1em; text-align: center; margin-bottom: 10px; height: 25px;}
    </style>
</head>
<body>
    <div id="app">
        <!-- LEFT PANEL (Controls & Setup) -->
        <div class="panel side-panel">
            <a href="index.html" class="action-btn back-btn">⬅ Back to Menu</a>
            <h2 class="text-center" style="color: #89ddff; margin-bottom: 15px;">Darts</h2>

            <!-- Setup Phase -->
            <div id="setup-phase">
                <div class="setup-card" style="border-left: 4px solid #89ddff;">
                    <div class="input-group">
                        <label class="input-label" style="color: #89ddff;">Game Type</label>
                        <select id="game-type" class="select-input">
                            <option value="301" selected>301</option>
                            <option value="501">501</option>
                        </select>
                    </div>
                    <div class="input-group" style="margin-bottom: 8px;">
                        <label style="color: #a9b1d6; font-size: 0.9em; display: flex; align-items: center; gap: 10px; cursor: pointer;">
                            <input type="checkbox" id="rule-double-in"> Require Double-In
                        </label>
                    </div>
                    <div class="input-group" style="margin-bottom: 0;">
                        <label style="color: #a9b1d6; font-size: 0.9em; display: flex; align-items: center; gap: 10px; cursor: pointer;">
                            <input type="checkbox" id="rule-double-out"> Require Double-Out
                        </label>
                    </div>
                </div>

                <div class="setup-card" style="border-left: 4px solid #bb9af7;">
                    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px;">
                        <label class="input-label" style="color: #bb9af7; margin-bottom: 0;">Roster</label>
                        <button class="add-btn" id="btn-add-player">+ Add</button>
                    </div>
                    <div id="player-list-container">
                        <!-- Player Rows Injected Here -->
                    </div>
                </div>

                <div class="setup-card" style="border-left: 4px solid #e0af68;">
                    <div class="input-group" style="margin-bottom: 0;">
                        <label class="input-label" style="color: #e0af68;">User Aim Sway</label>
                        <select id="user-diff" class="select-input">
                            <option value="easy">Easy (Steady)</option>
                            <option value="medium" selected>Medium (Wavering)</option>
                            <option value="hard">Hard (Shaky)</option>
                        </select>
                    </div>
                </div>

                <button class="action-btn confirm-btn" id="btn-start" style="width: 100%; background: #565f89; color: white;">Start Match</button>
            </div>

            <!-- In-Game RP Phase -->
            <div id="game-controls-phase" style="display: none;">
                <div class="setup-card" style="border-color: #89ddff;">
                    <h3 id="turn-status-title" style="color: #89ddff; margin-bottom: 5px; text-align: center;">Waiting...</h3>
                    <p id="turn-status-desc" style="color: #a9b1d6; font-size: 0.9em; text-align: center; margin-bottom: 15px; min-height: 40px;"></p>
                    
                    <div id="rp-container" style="display: none;">
                        <label class="input-label">Roleplay Response</label>
                        <textarea id="midgame-rp-text" placeholder="*Takes a sip of my drink before throwing...*" style="width: 100%; min-height: 80px; background: #050505; color: white; border: 1px solid #24283b; border-radius: 5px; padding: 10px; margin-bottom: 15px; resize: vertical; box-sizing: border-box;"></textarea>
                        
                        <div style="display: flex; gap: 10px; flex-direction: column;">
                            <button class="action-btn confirm-btn" id="btn-push-next" style="margin-bottom: 0; padding: 12px;">Push RP & Next Turn</button>
                            <button class="action-btn cancel-btn" id="btn-skip-next" style="margin-bottom: 0; padding: 10px;">Skip RP & Continue</button>
                        </div>
                    </div>
                </div>
                
                <button class="action-btn cancel-btn" id="btn-restart" style="width: 100%;">🔄 End Match Early</button>
            </div>
            
            <!-- End Game Phase -->
            <div id="end-phase" style="display: none;">
                <div class="setup-card" style="border-color: #f7768e; text-align: center;">
                    <h3 style="color: #f7768e; margin-bottom: 10px;">Game Over!</h3>
                    <p id="end-stats" style="color: #a9b1d6; font-size: 1.1em; margin-bottom: 15px; font-weight: bold;"></p>
                    
                    <textarea id="end-rp-text" placeholder="Final thoughts or reactions..." style="width: 100%; min-height: 80px; background: #050505; color: white; border: 1px solid #24283b; border-radius: 5px; padding: 10px; margin-bottom: 15px; resize: vertical; box-sizing: border-box;"></textarea>
                    
                    <button class="action-btn confirm-btn" id="btn-push-end" style="width: 100%;">Push Final Results</button>
                </div>
            </div>
        </div>

        <!-- RIGHT PANEL (Dartboard) -->
        <div class="panel main-panel">
            <div class="hud-grid" id="score-hud">
                <!-- Mini cards injected here -->
            </div>
            
            <div class="darts-left-display" id="darts-left-display"></div>

            <div class="board-container" id="dartboard">
                <div class="dart-reticle" id="reticle"></div>
                <div id="markers-layer"></div>
            </div>
        </div>
    </div>
    
    <script src="st_bridge.js"></script>
    <script src="darts.js"></script>
</body>
</html>

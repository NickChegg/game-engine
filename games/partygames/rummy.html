<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rummy</title>
    <link rel="stylesheet" href="style.css">
    <style>
        /* Changed flex-wrap to nowrap and added overflow-x to force side-by-side always */
        #app { max-width: 1000px !important; display: flex; flex-direction: row; flex-wrap: nowrap; justify-content: flex-start; gap: 20px; align-items: flex-start; width: 100%; position: relative; overflow-x: auto; margin: 0 auto; padding-bottom: 20px;}
        .side-panel { width: 320px; flex-shrink: 0; align-self: flex-start; }
        .main-panel { flex-grow: 1; max-width: 650px; min-width: 300px; align-self: flex-start; }
        
        .input-group { margin-bottom: 15px; }
        .input-label { display: block; font-size: 0.85em; color: #787c99; margin-bottom: 5px; text-transform: uppercase; }
        .text-input, .num-input, .select-input { width: 100%; background-color: #1a1b26; color: var(--text-main); border: 1px solid #15161e; border-radius: 5px; padding: 10px; font-size: 1em; box-sizing: border-box; margin-bottom: 5px;}
        .text-input:focus, .num-input:focus, .select-input:focus { outline: 1px solid var(--accent); }
        .flex-row { display: flex; gap: 10px; align-items: center; }
        .flex-row > * { flex: 1; }
        
        /* Disabled Button Style */
        .action-btn:disabled { opacity: 0.4; cursor: not-allowed; filter: grayscale(80%); transform: none !important; }

        /* Board Areas */
        .board-section { background: #1a1b26; border: 1px solid #24283b; border-radius: 8px; padding: 15px; margin-bottom: 15px; }
        
        /* Opponents */
        .opponents-container { display: flex; flex-wrap: wrap; gap: 10px; justify-content: center; }
        .opp-badge { background: #15161e; border: 1px solid #565f89; border-radius: 8px; padding: 10px; text-align: center; min-width: 100px; transition: 0.2s;}
        .opp-badge.active-turn { border-color: #9ece6a; box-shadow: 0 0 10px rgba(158, 206, 106, 0.2); background: rgba(158, 206, 106, 0.05); }
        .opp-name { color: #89ddff; font-weight: bold; font-size: 0.95em; margin-bottom: 5px; }
        .opp-score { color: #e0af68; font-size: 0.8em; font-weight: bold; margin-top: 5px; display: none; }

        /* Table */
        .table-area { display: flex; gap: 20px; align-items: center; margin-bottom: 15px; justify-content: center;}
        .deck-pile { cursor: pointer; transition: transform 0.1s; display: flex; flex-direction: column; align-items: center; }
        .deck-pile:hover:not(.disabled) { transform: translateY(-5px); }
        .deck-pile.disabled { opacity: 0.5; cursor: not-allowed; }
        .discard-pile { position: relative; display: flex; flex-direction: column; align-items: center; cursor: pointer; transition: transform 0.1s;}
        .discard-pile:hover:not(.disabled) { transform: translateY(-5px); }
        .discard-pile.disabled { opacity: 0.5; cursor: not-allowed; }

        /* Melds */
        .melds-area { display: flex; flex-wrap: wrap; gap: 15px; justify-content: center; min-height: 70px; padding: 10px; background: #15161e; border-radius: 5px; border: 1px dashed #24283b;}
        .meld-group { display: flex; gap: -20px; padding: 5px; border: 1px solid #565f89; border-radius: 5px; background: #1a1b26; cursor: pointer; transition: 0.2s; }
        .meld-group:hover { border-color: #9ece6a; background: rgba(158, 206, 106, 0.1); }
        .meld-group .playing-card { margin-right: -15px; }
        .meld-group .playing-card:last-child { margin-right: 0; }

        /* User Hand */
        .user-hand { display: flex; flex-wrap: wrap; gap: 5px; justify-content: center; min-height: 60px; }
        .user-card { cursor: pointer; transition: transform 0.2s; position: relative; }
        .user-card:hover { transform: translateY(-10px); }
        .user-card.selected { transform: translateY(-15px); }
        .user-card.selected .playing-card { border: 2px solid #7aa2f7; box-shadow: 0 0 10px rgba(122, 162, 247, 0.5); }
        .user-card.invalid { opacity: 0.4; cursor: not-allowed; transform: none; }

        /* Action Log */
        #action-log {
            height: 120px; overflow-y: auto; color: #a9b1d6; font-size: 0.85em;
            display: flex; flex-direction: column; gap: 5px; padding: 10px;
            background: #15161e; border-radius: 8px; border: 1px solid #24283b;
            margin-bottom: 15px; font-family: monospace;
        }

        .phase-banner {
            text-align: center; font-weight: bold; padding: 8px; border-radius: 5px; margin-bottom: 10px; font-size: 0.9em; text-transform: uppercase; letter-spacing: 1px;
        }
        .phase-draw { background: #565f89; color: white; }
        .phase-play { background: #9ece6a; color: #1a1b26; }
        .phase-discard { background: #f7768e; color: #1a1b26; }
    </style>
</head>
<body>
    <div id="app">
        <!-- LEFT PANEL -->
        <div class="panel side-panel">
            <a href="index.html" class="action-btn back-btn">⬅ Back to Menu</a>
            <h2 class="text-center" style="color: #9ece6a; margin-bottom: 10px;">🃏 Rummy</h2>
            <div id="running-score-display" style="text-align: center; color: #e0af68; font-weight: bold; margin-bottom: 15px; display: none;">Round <span id="round-num">1</span></div>

            <!-- SETUP PHASE -->
            <div id="setup-phase">
                <div class="input-group">
                    <label class="input-label">Game Mode</label>
                    <select id="game-mode" class="select-input">
                        <option value="single">Single Game</option>
                        <option value="running">Running Game (Points System)</option>
                    </select>
                </div>

                <div class="input-group">
                    <label class="input-label">Total Players (2-4)</label>
                    <input type="number" id="num-players" class="num-input" value="2" min="2" max="4">
                </div>

                <div id="players-container" style="background: #1a1b26; padding: 10px; border-radius: 8px; margin-bottom: 15px;">
                    <!-- Player inputs generated here -->
                </div>
                
                <button class="action-btn confirm-btn" id="btn-start" style="width: 100%;">Shuffle & Deal</button>
            </div>

            <!-- GAME CONTROLS PHASE -->
            <div id="game-controls-phase" style="display: none;">
                
                <div id="action-log"></div>

                <!-- Kept always active, merely disabled to prevent layout jumping -->
                <div id="user-actions" style="display: flex; flex-direction: column; gap: 8px; margin-bottom: 15px;">
                    <div id="phase-banner" class="phase-banner phase-draw">Draw Phase</div>
                    
                    <button class="action-btn" id="btn-meld" style="background: #9ece6a; color: #1a1b26; margin-bottom: 0;" disabled>Play Meld (Set/Run)</button>
                    <button class="action-btn" id="btn-discard" style="background: #f7768e; color: #1a1b26; margin-bottom: 0;" disabled>Discard Selected</button>
                    <button class="action-btn cancel-btn" id="btn-clear-sel" style="margin-bottom: 0;" disabled>Clear Selection</button>
                    
                    <!-- Changed to visibility hidden to maintain vertical size flow -->
                    <div id="layoff-hint" style="color: #a9b1d6; font-size: 0.85em; text-align: center; visibility: hidden; min-height: 1.2em;">
                        Select 1 card and click a meld on the table to lay it off.
                    </div>
                </div>

                <button class="action-btn" id="btn-npc-turn" style="background: #e0af68; color: #1a1b26; margin-bottom: 15px;" disabled>Execute NPC Turn ➡</button>

                <div style="background: #1a1b26; padding: 15px; border-radius: 8px; border: 1px solid #565f89; margin-bottom: 15px;">
                    <p style="font-size: 0.8em; color: #7aa2f7; margin-bottom: 8px; font-weight: bold;">MID-GAME ROLEPLAY</p>
                    <textarea id="midgame-rp-text" placeholder="Your response..." style="min-height: 50px; margin-bottom: 10px; background: #24283b; color: white; border: none; width: 100%; padding: 10px; border-radius: 5px; resize: vertical; box-sizing: border-box;"></textarea>
                    <button class="action-btn" id="btn-push-midgame" style="background-color: #565f89; color: white; margin-bottom: 0; font-size: 0.9em;">Push State to Chat</button>
                </div>
            </div>
        </div>

        <!-- RIGHT PANEL (Arena) -->
        <div class="panel main-panel" id="arena-panel">
            
            <div class="board-section">
                <div class="opponents-container" id="opponents-list"></div>
            </div>

            <div class="board-section" style="text-align: center;">
                <h3 style="color: #a9b1d6; margin-bottom: 15px; font-size: 0.9em; text-transform: uppercase;">The Table</h3>
                
                <div class="table-area">
                    <div class="deck-pile" id="draw-pile" title="Draw from Stock">
                        <div class="playing-card card-hidden" style="width: 50px; height: 70px;">?</div>
                        <div style="font-size: 0.7em; color: #787c99; margin-top: 5px;">Stock (<span id="deck-count">0</span>)</div>
                    </div>
                    <div class="discard-pile" id="discard-pile" title="Draw from Discard">
                        <div id="discard-top-card"></div>
                        <div style="font-size: 0.7em; color: #787c99; margin-top: 5px;">Discard</div>
                    </div>
                </div>

                <div class="melds-area" id="melds-container">
                    <span style="color: #565f89; font-style: italic; line-height: 50px;">No melds on table</span>
                </div>
            </div>

            <div class="board-section">
                <h3 style="color: #9ece6a; margin-bottom: 10px; display: flex; justify-content: space-between;">
                    Your Hand
                    <span id="turn-indicator" style="color: #f7768e; font-size: 0.8em; display: none;">Wait for your turn!</span>
                </h3>
                <div class="user-hand" id="user-hand-container"></div>
            </div>
        </div>

        <!-- END PANEL -->
        <div class="panel main-panel" id="end-panel" style="display: none;">
            <h2 class="text-center" style="color: #9ece6a; margin-bottom: 10px;" id="end-title">Game Over</h2>
            <div id="end-stats" style="margin-bottom: 20px; font-size: 1.1em; text-align: center; line-height: 1.4; padding: 15px; background: #1a1b26; border-radius: 8px;"></div>
            
            <textarea id="end-rp-text" placeholder='Your final roleplay response...' style="min-height: 80px; margin-bottom: 10px; background: #24283b; color: white; border: none; width: 100%; padding: 10px; border-radius: 5px; box-sizing: border-box; resize: vertical;"></textarea>
            
            <div style="display: flex; gap: 10px; margin-top: 10px;">
                <button class="action-btn confirm-btn" id="btn-confirm-end" style="margin-bottom: 0;">Push Results</button>
                <button class="action-btn" id="btn-next-round" style="background: #e0af68; color: #1a1b26; margin-bottom: 0; display: none;">Next Round</button>
                <button class="action-btn cancel-btn" id="btn-cancel-end" style="margin-bottom: 0;">End / New Game</button>
            </div>
        </div>
        
    </div>
    
    <script src="st_bridge.js"></script>
    <script src="rummy.js"></script>
</body>
</html>

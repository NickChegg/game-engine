<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Blackjack</title>
    <link rel="stylesheet" href="style.css">
    <style>
        .input-group { margin-bottom: 15px; }
        .input-label { display: block; font-size: 0.85em; color: #787c99; margin-bottom: 5px; text-transform: uppercase; }
        .text-input, .num-input, .select-input { width: 100%; background-color: #1a1b26; color: var(--text-main); border: 1px solid #15161e; border-radius: 5px; padding: 10px; font-size: 1em; margin-bottom: 5px;}
        .text-input:focus, .num-input:focus, .select-input:focus { outline: 1px solid var(--accent); }
        
        /* Layout */
        .flex-row { display: flex; gap: 10px; align-items: center; }
        .flex-row > * { flex: 1; }
        
        /* Cards */
        .playing-card {
            display: inline-flex; justify-content: center; align-items: center;
            background-color: #e0e6ed; color: black; border: 1px solid #1a1b26;
            border-radius: 5px; width: 40px; height: 55px; font-weight: bold; font-size: 1.1em;
            box-shadow: 2px 2px 5px rgba(0,0,0,0.3); margin-right: 5px;
        }
        .card-red { color: #d32f2f; }
        .card-black { color: #111; }
        .card-hidden { background: repeating-linear-gradient(45deg, #24283b, #24283b 5px, #1a1b26 5px, #1a1b26 10px); color: transparent; border-color: #565f89; }
        
        /* Board Areas */
        .board-section { background: #1a1b26; border: 1px solid #24283b; border-radius: 8px; padding: 15px; margin-bottom: 15px; }
        .player-row { display: flex; justify-content: space-between; align-items: center; padding: 8px 0; border-bottom: 1px solid #24283b; }
        .player-row:last-child { border-bottom: none; }
        
        .active-turn { border: 1px solid #9ece6a; background: rgba(158, 206, 106, 0.05); }
        .status-badge { padding: 4px 8px; border-radius: 4px; font-size: 0.8em; font-weight: bold; background: #24283b; color: #a9b1d6; }
        .status-bust { background: #f7768e; color: #1a1b26; }
        .status-stand { background: #565f89; color: white; }
        .status-blackjack { background: #e0af68; color: #1a1b26; }
    </style>
</head>
<body>
    <div id="app" style="max-width: 700px;">
        
        <!-- PHASE 1: SETUP -->
        <div class="panel" id="setup-panel">
            <a href="index.html" class="action-btn back-btn">⬅ Back to Menu</a>
            <h2 class="text-center" style="margin-bottom: 20px; color: white;">♠️ Blackjack</h2>

            <div class="input-group">
                <label class="input-label">Dealer Mode</label>
                <select id="dealer-mode" class="select-input">
                    <option value="floating">Floating Dealer (Invisible casino dealer)</option>
                    <option value="user">You ({{user}}) are the Dealer</option>
                    <option value="character">A Specific Character is the Dealer</option>
                </select>
            </div>

            <div class="input-group" id="dealer-name-group" style="display: none;">
                <label class="input-label">Dealer's Name</label>
                <input type="text" id="dealer-name" class="text-input" placeholder="e.g. Alice">
            </div>

            <div class="input-group">
                <label class="input-label">Number of Players (Excluding Dealer)</label>
                <input type="number" id="num-players" class="num-input" value="1" min="1" max="7">
            </div>

            <div id="players-container" style="background: #1a1b26; padding: 10px; border-radius: 8px; margin-bottom: 15px;">
                <!-- Player inputs generated here -->
            </div>
            
            <button class="action-btn confirm-btn" id="btn-start" style="width: 100%;">Shuffle & Deal</button>
        </div>

        <!-- PHASE 2: GAME BOARD -->
        <div class="panel" id="game-panel" style="display: none;">
            <h2 class="text-center" style="color: white; margin-bottom: 5px;">Blackjack</h2>
            
            <!-- Dealer Area -->
            <div class="board-section" id="dealer-area">
                <h3 style="color: #f7768e; margin-bottom: 10px;">Dealer: <span id="dealer-ui-name"></span></h3>
                <div id="dealer-cards"></div>
                <div style="margin-top: 5px; font-size: 0.9em; color: #787c99;">Value: <span id="dealer-val">?</span></div>
            </div>

            <!-- Players Area -->
            <div class="board-section" id="players-area">
                <h3 style="color: #7aa2f7; margin-bottom: 10px;">The Table</h3>
                <div id="table-list"></div>
            </div>

            <!-- Action Controls (Only visible on User's Turn) -->
            <div id="action-controls" style="display: none; gap: 10px; margin-bottom: 15px;">
                <button class="action-btn" id="btn-hit" style="background: #9ece6a; color: #1a1b26; margin-bottom: 0;">Hit (Draw Card)</button>
                <button class="action-btn" id="btn-stand" style="background: #565f89; color: white; margin-bottom: 0;">Stand (End Turn)</button>
            </div>
            
            <!-- NPC / Next Turn Control -->
            <button class="action-btn" id="btn-next-turn" style="background: #e0af68; color: #1a1b26; margin-bottom: 15px; display: none;">Next Turn ➡</button>

            <!-- Mid-Game Push Roleplay Box -->
            <div style="background: #1a1b26; padding: 15px; border-radius: 8px; border: 1px solid #565f89;">
                <p style="font-size: 0.85em; color: #7aa2f7; margin-bottom: 8px; font-weight: bold;">MID-GAME ROLEPLAY</p>
                <textarea id="midgame-rp-text" placeholder="Your roleplay response..." style="min-height: 50px; margin-bottom: 10px; background: #24283b; color: white; border: none; width: 100%; padding: 10px; border-radius: 5px;"></textarea>
                <button class="action-btn" id="btn-push-midgame" style="background-color: #565f89; color: white; margin-bottom: 0; font-size: 0.95em;">Push Current State to Chat</button>
            </div>
        </div>

        <!-- PHASE 3: END GAME PANEL -->
        <div class="panel" id="end-game-panel" style="display: none;">
            <h2 class="text-center" style="color: #e0af68; margin-bottom: 10px;">Round Over</h2>
            <div id="end-stats" style="margin-bottom: 20px; font-size: 1em; line-height: 1.4; padding: 15px; background: #1a1b26; border-radius: 8px;"></div>
            
            <p style="margin-bottom: 5px; font-size: 0.9em; color: #787c99;">Your Roleplay Response:</p>
            <textarea id="end-rp-text" placeholder='e.g. *I groan as the dealer flips a Blackjack.*'></textarea>
            
            <div style="display: flex; gap: 10px; margin-top: 10px;">
                <button class="action-btn confirm-btn" id="btn-confirm-end" style="margin-bottom: 0;">Push Results</button>
                <button class="action-btn cancel-btn" id="btn-cancel-end" style="margin-bottom: 0;">New Round</button>
            </div>
        </div>
    </div>
    
    <script src="st_bridge.js"></script>
    <script src="blackjack.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chess</title>
    <link rel="stylesheet" href="style.css">
    <style>
        body { display: flex; flex-direction: row; align-items: flex-start; justify-content: flex-start; padding: 0; overflow: hidden; margin: 0; }
        
        .left-menu {
            width: 320px; min-width: 320px; height: 100vh; 
            background-color: var(--panel-bg); border-right: 2px solid #565f89;
            padding: 20px; overflow-y: auto; box-shadow: 5px 0 15px rgba(0,0,0,0.3); z-index: 10;
        }
        
        .right-board {
            flex-grow: 1; height: 100vh; display: flex; flex-direction: column; 
            justify-content: center; align-items: center; background-color: var(--bg-color); overflow-y: auto;
        }

        .chess-container { display: flex; flex-direction: column; align-items: center; gap: 15px; }
        
        .chessboard {
            display: grid; grid-template-columns: repeat(8, 1fr); grid-template-rows: repeat(8, 1fr);
            width: 400px; height: 400px; border: 4px solid #24283b; box-shadow: 0 10px 25px rgba(0,0,0,0.5);
            background-color: #565f89;
        }
        
        .square { 
            display: flex; justify-content: center; align-items: center; 
            font-size: 2.5em; cursor: pointer; user-select: none; 
            transition: background 0.2s; line-height: 1; 
        }
        .light-sq { background-color: #a9b1d6; color: #15161e; }
        .dark-sq { background-color: #565f89; color: #1a1b26; }
        .square.selected { background-color: #e0af68 !important; }
        .square.valid-move { position: relative; }
        .square.valid-move::after { content: ''; position: absolute; width: 15px; height: 15px; background: rgba(158, 206, 106, 0.6); border-radius: 50%; }

        .input-group { margin-bottom: 15px; }
        .input-label { display: block; font-size: 0.85em; color: #787c99; margin-bottom: 5px; text-transform: uppercase; }
        .text-input, .select-input { width: 100%; background-color: #1a1b26; color: var(--text-main); border: 1px solid #15161e; border-radius: 5px; padding: 10px; font-size: 1em; margin-bottom: 5px; }
        .text-input:focus, .select-input:focus { outline: 1px solid var(--accent); }
    </style>
</head>
<body>
    <div class="left-menu">
        <a href="index.html" class="action-btn back-btn" style="padding: 10px; font-size: 0.9em;">⬅ Back to Menu</a>
        <h2 class="text-center" style="margin-bottom: 20px;">Chess</h2>

        <div id="setup-panel">
            <div class="input-group" style="padding: 10px; background: #1a1b26; border-radius: 8px; border-left: 3px solid #a9b1d6;">
                <label class="input-label" style="color: #a9b1d6;">White Player (P1)</label>
                <input type="text" id="p1-name" class="text-input" value="{{user}}" placeholder="Name">
                <select id="p1-type" class="select-input" onchange="toggleDiff('p1')">
                    <option value="human" selected>Human</option>
                    <option value="ai">AI Driven</option>
                </select>
                <select id="p1-diff" class="select-input" style="display: none;">
                    <option value="1">Elo 600 (Beginner)</option>
                    <option value="2">Elo 1000 (Novice)</option>
                    <option value="3">Elo 1400 (Intermediate)</option>
                    <option value="4">Elo 2000 (Expert)</option>
                    <option value="5">Elo 2500 (Grandmaster)</option>
                    <option value="6">Elo 3000+ (Inhuman)</option>
                </select>
            </div>

            <div class="input-group" style="padding: 10px; background: #1a1b26; border-radius: 8px; border-left: 3px solid #565f89;">
                <label class="input-label" style="color: #565f89;">Black Player (P2)</label>
                <input type="text" id="p2-name" class="text-input" value="{{char}}" placeholder="Name">
                <select id="p2-type" class="select-input" onchange="toggleDiff('p2')">
                    <option value="human">Human</option>
                    <option value="ai" selected>AI Driven</option>
                </select>
                <select id="p2-diff" class="select-input">
                    <option value="1">Elo 600 (Beginner)</option>
                    <option value="2">Elo 1000 (Novice)</option>
                    <option value="3" selected>Elo 1400 (Intermediate)</option>
                    <option value="4">Elo 2000 (Expert)</option>
                    <option value="5">Elo 2500 (Grandmaster)</option>
                    <option value="6">Elo 3000+ (Inhuman)</option>
                </select>
            </div>

            <button class="action-btn confirm-btn" id="btn-start" style="width: 100%; margin-top: 10px;">Start Match</button>
        </div>

        <div id="controls-panel" style="display: none;">
            <div id="turn-indicator" style="background: #1a1b26; padding: 10px; border-radius: 8px; text-align: center; font-weight: bold; color: #9ece6a; margin-bottom: 20px;">
                White's Turn
            </div>

            <label class="input-label">Mid-Game Push</label>
            <textarea id="mid-game-rp" class="text-input" placeholder="*I tap my chin, staring intently at the board...*" style="min-height: 60px; font-size: 0.9em;"></textarea>
            <button class="action-btn" id="btn-push-state" style="background: #7aa2f7; color: #15161e; padding: 10px; font-size: 0.9em;">Push State to Chat</button>

            <hr style="border: 0; border-top: 1px solid #565f89; margin: 15px 0;">
            <button class="action-btn reset-btn" id="btn-reset" style="padding: 10px; font-size: 0.9em;">Forfeit / Reset</button>
        </div>
    </div>

    <div class="right-board">
        <div class="chess-container" id="game-area" style="opacity: 0.3; pointer-events: none;">
            <div class="chessboard" id="board"></div>
        </div>

        <div class="panel" id="end-panel" style="display: none; position: absolute; z-index: 20; max-width: 350px;">
            <h2 class="text-center" style="color: #f7768e; margin-bottom: 10px;">Checkmate!</h2>
            <div id="end-stats" class="text-center" style="margin-bottom: 20px; font-weight: bold;"></div>
            <p style="margin-bottom: 5px; font-size: 0.9em; color: #787c99;">Final Roleplay Response:</p>
            <textarea id="end-rp-text" class="text-input" placeholder='*I knock your king over with a smirk.*'></textarea>
            <button class="action-btn confirm-btn" id="btn-confirm-end" style="width: 100%; margin-top: 10px;">Push Win</button>
        </div>
    </div>

    <!-- 1. ST Bridge -->
    <script src="st_bridge.js"></script>
    <!-- 2. Official Chess.js Library (Validates moves) -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/chess.js/0.10.3/chess.min.js"></script>
    <!-- 3. Our Custom Game Logic -->
    <script src="chess.js"></script>

    <script>
        function toggleDiff(p) {
            const type = document.getElementById(p + '-type').value;
            document.getElementById(p + '-diff').style.display = type === 'ai' ? 'block' : 'none';
        }
    </script>
</body>
</html>
